<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Project Elysium">
  <defs>
    <radialGradient id="ceu" cx="50%" cy="18%" r="85%">
      <stop offset="0%" stop-color="#1b2634"/>
      <stop offset="55%" stop-color="#0d1219"/>
      <stop offset="100%" stop-color="#05080b"/>
    </radialGradient>
    <linearGradient id="solo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c2a20"/>
      <stop offset="100%" stop-color="#15140f"/>
    </linearGradient>
    <linearGradient id="lua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a33d" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#7a5420" stop-opacity=".7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#ceu)"/>

  <!-- estrelas -->
  <g fill="#c9d6e2">
    <circle cx="120" cy="60" r="1.4" opacity=".7"/><circle cx="310" cy="38" r="1" opacity=".5"/>
    <circle cx="520" cy="72" r="1.2" opacity=".6"/><circle cx="700" cy="44" r="1" opacity=".45"/>
    <circle cx="880" cy="90" r="1.5" opacity=".65"/><circle cx="1050" cy="52" r="1.1" opacity=".55"/>
    <circle cx="200" cy="150" r="1" opacity=".4"/><circle cx="1130" cy="170" r="1.2" opacity=".5"/>
    <circle cx="60" cy="215" r="1" opacity=".35"/><circle cx="960" cy="215" r="1" opacity=".4"/>
  </g>

  <!-- aurora -->
  <path d="M0 210 Q 300 150 600 205 T 1200 175 L1200 250 Q 900 210 600 255 T 0 240 Z"
        fill="#4fd1c5" opacity=".07"/>
  <path d="M0 235 Q 350 185 700 235 T 1200 215 L1200 265 Q 800 240 400 275 T 0 262 Z"
        fill="#a98bd6" opacity=".06"/>

  <!-- Kore, a lua grande -->
  <circle cx="1010" cy="132" r="76" fill="url(#lua)" opacity=".28"/>
  <circle cx="1010" cy="132" r="76" fill="none" stroke="#e8a33d" stroke-opacity=".3"/>
  <circle cx="988" cy="112" r="13" fill="#05080b" opacity=".18"/>
  <circle cx="1032" cy="152" r="9"  fill="#05080b" opacity=".15"/>
  <circle cx="1000" cy="160" r="6"  fill="#05080b" opacity=".12"/>

  <!-- cordilheira ao fundo -->
  <path d="M0 300 L110 244 L190 288 L275 226 L360 292 L455 250 L540 300 L640 238
           L720 296 L820 252 L910 300 L1010 258 L1110 302 L1200 268 L1200 400 L0 400 Z"
        fill="#1b222b"/>
  <!-- planície -->
  <path d="M0 320 L1200 296 L1200 400 L0 400 Z" fill="url(#solo)"/>

  <!-- casco da nave, tombado -->
  <g transform="translate(150 318) rotate(-14)">
    <rect x="0" y="0" width="190" height="34" rx="16" fill="#2f3a46"/>
    <rect x="0" y="0" width="190" height="34" rx="16" fill="none" stroke="#48586a"/>
    <circle cx="40" cy="17" r="5" fill="#0d1219"/>
    <circle cx="70" cy="17" r="5" fill="#0d1219"/>
    <circle cx="100" cy="17" r="5" fill="#0d1219"/>
    <path d="M176 4 L206 -12 L200 12 Z" fill="#2f3a46"/>
  </g>
  <ellipse cx="250" cy="352" rx="140" ry="10" fill="#05080b" opacity=".45"/>

  <!-- fogueira do acampamento -->
  <circle cx="470" cy="344" r="26" fill="#e8a33d" opacity=".10"/>
  <circle cx="470" cy="344" r="12" fill="#e8a33d" opacity=".18"/>
  <circle cx="470" cy="344" r="3.5" fill="#f5c76a"/>

  <!-- título -->
  <text x="600" y="150" text-anchor="middle" font-family="ui-monospace,Menlo,monospace"
        font-size="34" letter-spacing="14" fill="#e8a33d">PROJECT</text>
  <text x="600" y="212" text-anchor="middle" font-family="ui-monospace,Menlo,monospace"
        font-size="62" font-weight="700" letter-spacing="20" fill="#d7e2ec">ELYSIUM</text>
  <text x="600" y="248" text-anchor="middle" font-family="ui-monospace,Menlo,monospace"
        font-size="13" letter-spacing="5" fill="#7d8fa3">SIMULADOR DE COLONIZAÇÃO PLANETÁRIA</text>

  <text x="600" y="382" text-anchor="middle" font-family="ui-monospace,Menlo,monospace"
        font-size="12.5" letter-spacing="1.5" fill="#56677a">
    20 sobreviventes · 40 sols de comida · 31 de água · nenhum resgate
  </text>
</svg>
