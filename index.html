<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROJECT ELYSIUM — Simulador de Colonização</title>

<!-- Sem estas etiquetas, o link do jogo aparecia como URL nua em qualquer lugar
     onde fosse compartilhado: nada de título, descrição ou imagem. -->
<meta name="description" content="Vinte sobreviventes, um planeta que nunca foi habitado, nenhum resgate. Simulador de colonização planetária jogável no navegador — grátis, sem instalar, sem cadastro.">
<meta name="author" content="Wemerson Campos">
<meta name="theme-color" content="#0b1017">
<link rel="canonical" href="https://wc4mp0s.github.io/elysium/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="PROJECT ELYSIUM">
<meta property="og:url" content="https://wc4mp0s.github.io/elysium/">
<meta property="og:title" content="PROJECT ELYSIUM — Simulador de Colonização">
<meta property="og:description" content="Vinte sobreviventes, um planeta que nunca foi habitado, nenhum resgate. Grátis, sem instalar, sem cadastro. Português e inglês.">
<meta property="og:image" content="https://wc4mp0s.github.io/elysium/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="PROJECT ELYSIUM — vinte sobreviventes, um planeta que nunca foi habitado, nenhum resgate.">
<meta property="og:locale" content="pt_BR">
<meta property="og:locale:alternate" content="en_US">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="PROJECT ELYSIUM — Simulador de Colonização">
<meta name="twitter:description" content="Vinte sobreviventes, um planeta que nunca foi habitado, nenhum resgate. Grátis, sem instalar, sem cadastro.">
<meta name="twitter:image" content="https://wc4mp0s.github.io/elysium/social-preview.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-box">

    <h1>PROJECT<span>ELYSIUM</span></h1>
    <p class="boot-sub" id="bootPitch">Vinte sobreviventes. Um planeta que nunca foi habitado. Nenhum resgate.</p>

    <button id="btnJogar" class="jogar">JOGAR</button>

    <div class="dif-linha" id="difLinha">
      <button class="difOp sel" data-diff="facil">Sobrevivente</button>
      <button class="difOp" data-diff="normal">Difícil</button>
      <button class="difOp" data-diff="extremo">Extremo</button>
      <button class="difOp" data-diff="brutal">Brutal</button>
    </div>
    <p class="dif-txt" id="bootDifTxt"></p>

    <button id="btnLoadGame" class="continuar hidden">↩ Continuar colônia <b id="contInfo"></b></button>

    <div class="boot-mais">
      <button id="btnDiario">Desafio diário <b id="diarioNum"></b></button>
      <span>·</span>
      <button id="btnCenarios">Cenários <b id="cenCount"></b></button>
      <span>·</span>
      <button id="btnArquivo">Arquivo <b id="arqCount"></b></button>
    </div>
    <p class="boot-mais-st" id="diarioEstado"></p>

    <p class="boot-foot">
      Grátis, sem instalar, sem cadastro. Salva no seu navegador.
      <button id="btnSemente" class="linkzin">semente do mundo</button>
      <button id="btnLang" class="linkzin">EN</button>
    </p>
    <p class="boot-autor" id="bootAutor">um jogo de <b>Wemerson Campos</b></p>
    <div id="sementeBox" class="semente-box hidden">
      <input id="seedInput" type="text" value="" maxlength="24" placeholder="deixe vazio para um mundo aleatório">
    </div>

  </div>
</div>

<div id="app" class="app hidden">

  <header class="topbar">
    <div class="tb-logo">ELYSIUM</div>
    <div class="tb-clock">
      <span class="tb-sol">SOL <b id="hdSol">1</b></span>
      <span class="tb-date" id="hdDate">Ano 1 · Verdejo 34</span>
    </div>
    <div class="tb-weather" id="hdWeather">—</div>
    <div class="tb-stats" id="hdStats"></div>
    <div class="tb-right">
      <button id="btnSom" class="mini" title="Som" aria-label="Som">♪</button>
      <button id="btnLangJogo" class="mini" title="Language">EN</button>
      <button id="btnSide" class="mini only-mob" aria-label="Recursos">☰</button>
      <button id="btnSave" class="mini">Salvar</button>
      <button id="btnMenu" class="mini">Menu</button>
    </div>
  </header>

  <div class="vitstrip only-mob" id="vitStrip"></div>
  <div class="alertbar" id="alertBar"></div>

  <div class="layout">

    <div class="side-veu" id="sideVeu"></div>
    <aside class="side" id="side">
      <div class="panel">
        <h3>ESTOQUE VITAL</h3>
        <div id="vitals"></div>
      </div>
      <div class="panel">
        <h3>ENERGIA</h3>
        <div id="energyPanel"></div>
      </div>
      <div class="panel">
        <h3>MATERIAIS</h3>
        <div id="matsPanel" class="mats"></div>
      </div>
      <div class="panel">
        <h3>MÁQUINAS</h3>
        <div id="machPanel"></div>
      </div>
    </aside>

    <main class="main">
      <div id="tutSlot"></div>
      <nav class="tabs" id="tabs">
        <button data-tab="visao" class="sel">Visão Geral</button>
        <button data-tab="trabalho">Trabalho</button>
        <button data-tab="tripulacao">Tripulação</button>
        <button data-tab="construcao">Construção</button>
        <button data-tab="pesquisa">Pesquisa</button>
        <button data-tab="agricultura">Agricultura</button>
        <button data-tab="oficina">Oficina</button>
        <button data-tab="mapa">Mapa</button>
        <button data-tab="catalogo">Catálogo</button>
        <button data-tab="registro">Registro</button>
      </nav>
      <section class="tabbody" id="tabbody"></section>
    </main>

  </div>

  <footer class="bottombar">
    <div class="bb-labor" id="bbLabor"></div>
    <div class="bb-actions">
      <button id="btnAdvance" class="advance">AVANÇAR 1 SOL ▸</button>
      <button id="btnAdvance5" class="advance small">▸▸ 5 SOLS</button>
    </div>
  </footer>

</div>

<div id="modal" class="modal hidden">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="fimTela" class="fimwrap hidden"></div>

<div id="arqTela" class="fimwrap hidden"></div>

<div id="cenTela" class="fimwrap hidden"></div>

<div id="douTela" class="fimwrap hidden"></div>

<div id="dialog" class="modal dlg-wrap hidden">
  <div class="dlg" id="dialogBox"></div>
</div>

<div id="toast" class="toast"></div>

<script src="js/engine/rng.js"></script>
<script src="js/data/world.js"></script>
<script src="js/data/resources.js"></script>
<script src="js/data/crew.js"></script>
<script src="js/data/tech.js"></script>
<script src="js/data/buildings.js"></script>
<script src="js/data/crops.js"></script>
<script src="js/data/jobs.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/i18n.js"></script>
<script src="js/data/i18n_en.js"></script>
<script src="js/data/i18n_en_events.js"></script>
<script src="js/data/i18n_en_ui.js"></script>
<script src="js/engine/state.js"></script>
<script src="js/data/arquivo.js"></script>
<script src="js/data/cenarios.js"></script>
<script src="js/data/conquistas.js"></script>
<script src="js/engine/sim.js"></script>
<script src="js/engine/diario.js"></script>
<script src="js/engine/expedicao.js"></script>
<script src="js/data/demandas.js"></script>
<script src="js/data/doutrinas.js"></script>
<script src="js/ui/onboarding.js"></script>
<script src="js/ui/cartao.js"></script>
<script src="js/ui/conselhos.js"></script>
<script src="js/ui/som.js"></script>
<script src="js/ui/cronica.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
